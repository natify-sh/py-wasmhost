[build-system]
requires = ["setuptools>=84", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wasmhost"
dynamic = ["version"]
description = "WebAssembly for CPython, PyPy and Pythonista, run in JavaScriptCore or Node, with the JavaScript WebAssembly API"
readme = "README.md"
authors = [{ name = "o-murphy", email = "thehelixpg@gmail.com" }]
# 3.10 is what Pythonista runs.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["webassembly", "wasm", "javascriptcore", "jscontext", "pythonista", "node"]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Operating System :: iOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# fusedwasi is the WASI 0.1 host (`fusedwasi.p1`, pure Python). 0.1.0a1 is a pre-release: the specifier names one, so pip and uv take it without --pre.
dependencies = ["fusedwasi>=0.1.0a1"]

[project.scripts]
wasmhost = "wasmhost._cli:main"

[project.optional-dependencies]
wasmtime = ["wasmtime>=49.0.0"]
# The `gi-jsc` backend (WebKitGTK's JavaScriptCore through PyGObject, Linux only). PyGObject is built from source, so the
# system needs its development files first (see "Backends" in the README): PyGObject 3.52+ wants girepository-2.0
# (GLib 2.80+, Ubuntu 24.04 and later: `libgirepository-2.0-dev`), 3.50 and earlier girepository-1.0 (`libgirepository1.0-dev`;
# on such a system ask for `pygobject<3.52`). The typelib is `gir1.2-javascriptcoregtk-4.1`.
gi-jsc = ["PyGObject>=3.42; sys_platform == 'linux'"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["wasmhost", "wasmhost.wasi"]

[tool.setuptools.package-data]
wasmhost = ["py.typed"]

[tool.setuptools_scm]
# Until the repo has a tag (or any commit), there is nothing to derive a version from.
fallback_version = "0.0.0"
version_file = "src/wasmhost/_version.py"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.8",
    "wasmtime>=49.0.0",
    # The real Objective-C JSContext on a Mac, for tests/test_macos.py (Pythonista's objc_util exists only there)
    "rubicon-objc>=0.5.4; sys_platform == 'darwin'",
    # wasm3 backend; CPython 3.11+ only, and taken from git (see [tool.uv.sources])
    "pywasm3; python_version >= '3.11' and platform_python_implementation == 'CPython'",
]

[tool.uv.sources]
# pywasm3's PyPI release is years behind the API Wasm3Backend uses; build it from the repo (uv also
# fetches its wasm3 submodule). Needs a C compiler.
pywasm3 = { git = "https://github.com/wasm3/pywasm3", rev = "4c1334e03b29f9576e9ef265f5cf7c7d5d51a37d" } # main of 2026-09-28: exception handling API, a newer wasm3, on top of Py_mod_gil support

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-rf"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "examples"]
strict = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["wasmhost"]

[tool.coverage.paths]
# Data from runners of other OSes (macOS jsc/jscontext jobs) is combined on Linux.
source = ["src/", "*/src/", "*\\src\\"]
