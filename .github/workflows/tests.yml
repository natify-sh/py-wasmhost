name: Tests

# Builds the package from source and runs the suite once per backend, selected with pytest's --wasm-backend
# (see tests/conftest.py; a backend that can't start fails the step, it is never skipped). Coverage is not
# collected here (see coverage.yml); tiny-bclibc-wasm also runs the same backends through wasmhost and combines it there.
#
#   test:     every OS x CPython oldest/newest (also free-threaded 3.15t) + PyPy, on wasmtime and on Node (both
#             available on every runner), and on wasm3 where pywasm3 installs (CPython 3.11+; built from git).
#   pyodide:  the suite and the self-test run inside Pyodide (CPython in WebAssembly, on Node), where the backend is the
#             JavaScript engine's own WebAssembly (tests/pyodide_run.mjs).
#   jsc:      WebKitGTK's JavaScriptCore -- the engine behind Pythonista's JSContext -- with its JIT
#             and without it (iOS apps like Pythonista run it without), as the stand-in for an iOS
#             device.

on:
  push:
    paths-ignore: &non-code-paths
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore: *non-code-paths
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.15", "3.15t", "pypy3.11"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm needs tags for the package version

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: pytest --wasm-backend wasmtime
        run: uv run --locked pytest -v --wasm-backend wasmtime

      - name: pytest --wasm-backend node
        if: ${{ !cancelled() }} # run every backend even if an earlier one failed
        run: uv run --locked pytest -v --wasm-backend node

      # Bun is JavaScriptCore in a runtime of its own. Not on Windows yet: the pipe protocol of the node backend, with
      # a synchronous read of stdin, has not been tried there.
      - name: Set up Bun
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: pytest --wasm-backend bun
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: uv run --locked pytest -v --wasm-backend bun

      - name: pytest --wasm-backend wasm3
        # pywasm3 is a dev dependency only on CPython >= 3.11 (see pyproject.toml). Warnings are errors so
        # that, on 3.15t, an extension turning the GIL back on at import fails the run.
        if: ${{ !cancelled() && matrix.python-version != '3.10' && !startsWith(matrix.python-version, 'pypy') }}
        run: uv run --locked pytest -v -W error::RuntimeWarning --wasm-backend wasm3

      # On a Mac the JavaScriptCore of the system is there: through its C API (ctypes), and as a real Objective-C
      # JSContext through rubicon-objc, which is as near to Pythonista's objc_util as CI gets.
      - name: "pytest --wasm-backend jsc (macOS, JavaScriptCore.framework)"
        if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
        run: uv run --locked pytest -v --wasm-backend jsc

      - name: "pytest --wasm-backend jscontext (macOS, a real JSContext through rubicon-objc)"
        if: ${{ !cancelled() && matrix.os == 'macos-latest' && !startsWith(matrix.python-version, 'pypy') }}
        run: uv run --locked pytest -v --wasm-backend jscontext

      - name: Examples
        run: |
          WASMHOST_BACKEND=node uv run --locked python examples/basic.py
          WASMHOST_BACKEND=node uv run --locked python examples/imports.py

      # The official CPython built to wasm32-wasip1 (examples/cpython/), on two backends only: wasmtime (Linux x64 only), and on a Mac the
      # JSContext through rubicon-objc, the nearest CI gets to Pythonista (an 8 MB module and the start of its standard library).
      - name: "Example: CPython for WASI (wasmtime, Linux x64)"
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: WASMHOST_BACKEND=wasmtime uv run --locked python examples/cpython/run.py -c "$CPYTHON_PROGRAM" 2>/dev/null | grep -Fqx "$CPYTHON_EXPECT"
        env:
          CPYTHON_PROGRAM: "import sys, json, re, hashlib; print(sys.platform, json.dumps(re.findall(r'\\d+', 'a1b22')), hashlib.sha256(b'x').hexdigest()[:8], sum(range(10**6)))"
          CPYTHON_EXPECT: 'wasi ["1", "22"] 2d711642 499999500000'

      - name: "Example: CPython for WASI (jscontext, macOS, a real JSContext through rubicon-objc)"
        if: ${{ !cancelled() && matrix.os == 'macos-latest' && !startsWith(matrix.python-version, 'pypy') }}
        run: WASMHOST_BACKEND=jscontext uv run --locked python examples/cpython/run.py -c "$CPYTHON_PROGRAM" 2>/dev/null | grep -Fqx "$CPYTHON_EXPECT"
        env:
          CPYTHON_PROGRAM: "import sys, json, re, hashlib; print(sys.platform, json.dumps(re.findall(r'\\d+', 'a1b22')), hashlib.sha256(b'x').hexdigest()[:8], sum(range(10**6)))"
          CPYTHON_EXPECT: 'wasi ["1", "22"] 2d711642 499999500000'

  pyodide:
    name: Pyodide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Pyodide
        run: npm install --no-save --prefix "$RUNNER_TEMP/pyodide" pyodide@314.0.7

      # Run from the folder with node_modules, so that the script finds the package.
      - name: Self-test on the pyodide backend
        working-directory: ${{ runner.temp }}/pyodide
        run: node "$GITHUB_WORKSPACE/tests/pyodide_run.mjs" selftest

      - name: pytest --wasm-backend pyodide
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/pyodide
        run: node "$GITHUB_WORKSPACE/tests/pyodide_run.mjs" pytest

  jsc:
    name: WebKitGTK JavaScriptCore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install JavaScriptCore + PyGObject
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gir1.2-javascriptcoregtk-4.1 python3-gi

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      # python3-gi is built for the distribution's own Python, so use that interpreter with its
      # site-packages visible.
      - name: Install into a system-site-packages venv
        run: |
          uv venv --system-site-packages --python /usr/bin/python3 .venv
          uv pip install -e . pytest

      - name: pytest --wasm-backend gi-jsc (JIT on)
        run: .venv/bin/python -m pytest -v --wasm-backend gi-jsc
        env:
          JSC_useJIT: "true"

      - name: pytest --wasm-backend gi-jsc (JIT off, as on iOS)
        if: ${{ !cancelled() }}
        run: .venv/bin/python -m pytest -v --wasm-backend gi-jsc
        env:
          JSC_useJIT: "false"

      # The same engine through its C API (ctypes), no PyGObject: it also takes host functions (imports).
      - name: pytest --wasm-backend jsc (JIT on)
        if: ${{ !cancelled() }}
        run: .venv/bin/python -m pytest -v --wasm-backend jsc
        env:
          JSC_useJIT: "true"

      - name: pytest --wasm-backend jsc (JIT off, as on iOS)
        if: ${{ !cancelled() }}
        run: .venv/bin/python -m pytest -v --wasm-backend jsc
        env:
          JSC_useJIT: "false"

      - name: Examples
        run: |
          WASMHOST_BACKEND=gi-jsc .venv/bin/python examples/basic.py
          WASMHOST_BACKEND=jsc .venv/bin/python examples/imports.py
