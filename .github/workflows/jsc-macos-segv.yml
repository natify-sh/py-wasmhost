name: jsc macOS segfault

# A diagnostic, not a gate: it repeats the `jsc` step of Tests on macOS to measure how often the segmentation fault of BACKLOG
# ("the `jsc` backend on macOS") happens and under which conditions. It never fails on a crash; the counts are in the summary of
# each job, the logs and the macOS crash reports are the artifacts. It runs only by hand and on a push of the branch that
# investigates this (and of this file), so it does not slow Tests.
#
# Jobs: `repeat` (by hand) and `gc-stress` (docs/experiments/jsc_gc_stress). Variants of `repeat` (the same suite, the same step as in Tests, repeated):
#   baseline: nothing changed. The rate to compare with.
#   scribble: MallocScribble / MallocPreScribble: freed and new memory is filled with a pattern, so a use after free (a JavaScriptCore
#             value or a string that Python released too early) crashes at once and near the cause, not by luck.
#   nogc:     gc.disable() before the tests: if the crashes go away, a ctypes object freed by the garbage collector in the middle of
#             a call is the cause.

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Repeats of the suite in each job"
        default: "15"
  push:
    branches: [investigate-jsc-macos-segv]
    paths: [".github/workflows/jsc-macos-segv.yml", "docs/experiments/jsc_gc_stress/**"]

concurrency:
  group: jsc-segv-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repeat:
    # By hand only: 45 repeats (baseline, scribble, nogc; run 1) gave no crash, so a push does not run it again.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: ${{ matrix.variant }} / ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, scribble, nogc]
        python-version: ["3.10"]
    defaults:
      run:
        shell: bash
    env:
      REPEATS: ${{ github.event.inputs.repeats || '15' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm needs tags for the package version

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: Repeat the jsc step
        env:
          VARIANT: ${{ matrix.variant }}
          PYTHONFAULTHANDLER: "1"
        run: |
          mkdir -p logs
          case "$VARIANT" in
            scribble) export MallocScribble=1 MallocPreScribble=1 ;;
          esac
          crashes=0
          for i in $(seq 1 "$REPEATS"); do
            log="logs/$VARIANT-$i.log"
            set +e
            if [ "$VARIANT" = nogc ]; then
              uv run --locked python -X faulthandler -c "import gc, sys, pytest; gc.disable(); sys.exit(pytest.main(['-v', '-rs', '--wasm-backend', 'jsc']))" > "$log" 2>&1
            else
              uv run --locked pytest -v -rs --wasm-backend jsc > "$log" 2>&1
            fi
            code=$?
            set -e
            if grep -q "Fatal Python error: Segmentation fault" "$log"; then
              crashes=$((crashes + 1))
              echo "repeat $i: SEGFAULT (exit $code); last test line: $(grep -E '^tests/.*::' "$log" | tail -1)"
            else
              echo "repeat $i: exit $code"
            fi
          done
          {
            echo "### $VARIANT on Python ${{ matrix.python-version }}: $crashes segfaults in $REPEATS repeats"
            echo
            echo "Where they stopped (the last test line of each crashed log):"
            for log in logs/*.log; do
              if grep -q "Fatal Python error: Segmentation fault" "$log"; then
                echo "- \`$log\`: $(grep -E '^tests/.*::' "$log" | tail -1)"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "crashes=$crashes" >> "$GITHUB_ENV"

      - name: Collect the macOS crash reports
        if: ${{ always() }}
        run: |
          mkdir -p reports
          cp ~/Library/Logs/DiagnosticReports/*.ips reports/ 2>/dev/null || true
          ls reports | head -20

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: jsc-segv-${{ matrix.variant }}-${{ matrix.python-version }}
          path: |
            logs/
            reports/
          if-no-files-found: ignore

  # The stress test of docs/experiments/jsc_gc_stress/stress.py: `CApi.evaluate` in a loop, no collector thread (the first run, 2026-11-11,
  # crashed in 5 of 16 runs without one, and in 2 of 16 with it, at the same place as the crashes of Tests). The variants:
  #   control:      as it is.
  #   rooted:       the result of each evaluate is kept in a JavaScript array until it is text (the hypothesis of BACKLOG: a value that
  #                 Python holds between the API call and JSValueProtect is freed by a collection). If it is right, this crashes less.
  #   noconcurrent: JSC_useConcurrentGC=0 in the environment (if the system framework reads it): no collector thread of the engine.
  gc-stress:
    name: gc-stress ${{ matrix.variant }} / ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [control, rooted, noconcurrent]
        python-version: ["3.10", "3.15"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm needs tags for the package version

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: Stress (no collector thread of ours)
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p logs reports
          mode=control
          case "$VARIANT" in
            rooted) mode=rooted ;;
            noconcurrent) export JSC_useConcurrentGC=0 ;;
          esac
          uv run --locked python docs/experiments/jsc_gc_stress/stress.py --runs 12 --seconds 30 --scenario both --gc-thread off --variant "$mode" 2>&1 | tee logs/stress.log || true # a crash is a result, not a failed job
          iterations=$(awk '/ OK variant/ {for (i = 1; i <= NF; i++) if ($i ~ /^iterations=/) {split($i, a, "="); n += a[2]}} END {print n + 0}' logs/stress.log)
          {
            echo "### gc-stress $VARIANT on Python ${{ matrix.python-version }}"
            echo
            grep -E "^==" logs/stress.log | sed 's/^/- /'
            echo "- iterations in the runs that finished: $iterations (a crashed run does not count its own)"
            grep -E "CRASH|MISMATCH" logs/stress.log | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the macOS crash reports
        if: ${{ always() }}
        run: cp ~/Library/Logs/DiagnosticReports/*.ips reports/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: jsc-gc-stress-${{ matrix.variant }}-${{ matrix.python-version }}
          path: |
            logs/
            reports/
          if-no-files-found: ignore
